<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 600px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
        }

        .score {
            color: #fff;
            font-size: 2em;
            font-weight: bold;
        }

        .score-label {
            color: #aaa;
            font-size: 0.9em;
            margin-top: 5px;
        }

        #gameCanvas {
            display: block;
            background: #000;
            border: 3px solid #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        .controls {
            color: #fff;
            font-size: 0.95em;
            line-height: 1.8;
        }

        .controls p {
            margin: 5px 0;
        }

        .btn-group {
            margin-top: 20px;
        }

        button {
            padding: 12px 30px;
            margin: 0 10px;
            font-size: 1em;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: #45a049;
        }

        button.reset {
            background: #f44336;
        }

        button.reset:hover {
            background: #da190b;
        }

        .game-status {
            color: #fff;
            font-size: 1.2em;
            margin-top: 15px;
            height: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 PONG GAME 🎮</h1>
        
        <div class="scoreboard">
            <div>
                <div class="score" id="playerScore">0</div>
                <div class="score-label">PLAYER</div>
            </div>
            <div>
                <div class="score" id="computerScore">0</div>
                <div class="score-label">COMPUTER</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="btn-group">
            <button onclick="togglePause()">PAUSE / RESUME</button>
            <button class="reset" onclick="resetGame()">RESET GAME</button>
        </div>

        <div class="game-status" id="gameStatus"></div>

        <div class="controls">
            <p><strong>Player Controls:</strong></p>
            <p>🖱️ Mouse: Move paddle up/down</p>
            <p>⬆️⬇️ Arrow Keys: Move paddle up/down</p>
            <p><strong>First to 5 points wins!</strong></p>
        </div>
    </div>

    <script src="pong.js"></script>
</body>
</html>
